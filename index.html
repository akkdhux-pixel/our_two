<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LoveYou</title>
<style>
:root{
  --bg:#fffaf8; --paper:#fffdfc; --pink:#f7d8dc; --pink2:#f3c4cb;
  --rose:#e99aa7; --cream:#fff1e7; --lav:#eee9f7; --text:#5b4c50;
  --muted:#9d8e92; --line:#f1e5e4; --white:#fff;
  --shadow:0 8px 28px rgba(124,92,96,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-rounded,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif
}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{
  width:min(100%,760px);
  margin:auto;
  min-height:100vh;
  padding-bottom:86px
}
.top{
  padding:24px 20px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between
}
.logo{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1.5px;
  color:#4f4246
}
.logo span{color:var(--rose)}
.tiny{font-size:12px;color:var(--muted)}
.view{display:none;padding:16px 18px 20px}
.view.active{display:block}

.hero{
  background:linear-gradient(135deg,#fff1f1,#fff9ef);
  border:1px solid #f6e4e3;
  border-radius:28px;
  padding:24px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden
}
.hero:after{
  content:"♡";
  position:absolute;
  right:22px;
  top:10px;
  font-size:74px;
  color:rgba(233,154,167,.18);
  transform:rotate(12deg)
}
.eyebrow{
  font-size:13px;
  color:var(--rose);
  font-weight:700;
  margin-bottom:8px
}
.dday{
  font-size:46px;
  line-height:1;
  font-weight:850;
  letter-spacing:-2px;
  color:#4f4246
}
.sub{
  margin-top:9px;
  color:var(--muted);
  font-size:13px
}

.section{margin-top:18px}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 4px 9px;
  font-size:16px;
  font-weight:800
}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow)
}
.today{padding:17px}

.event{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line)
}
.event:last-child{
  border-bottom:0;
  padding-bottom:0
}
.event:first-child{padding-top:0}

.dot{
  width:38px;
  height:38px;
  border-radius:14px;
  background:var(--pink);
  display:grid;
  place-items:center;
  font-size:18px
}
.event b{font-size:14px}
.event small{
  display:block;
  color:var(--muted);
  margin-top:3px
}

.board{
  padding:15px;
  background:#fff5f6
}
.board-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}
.board-name{
  font-size:17px;
  font-weight:850
}
.board-note{
  font-size:11px;
  color:var(--muted)
}
.canvas-wrap{
  background:#fffafb;
  border:1px solid #f1dfe1;
  border-radius:18px;
  overflow:hidden;
  touch-action:none
}
#boardCanvas{
  display:block;
  width:100%;
  height:270px;
  touch-action:none
}
.tools{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:10px
}
.tool{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  color:var(--text);
  font-size:12px
}
.tool.active{
  background:var(--pink);
  border-color:#efc2c8
}
.size{
  width:68px;
  padding:8px 5px
}
.send{
  margin-left:auto;
  background:#e89aa6;
  color:white;
  font-weight:800;
  padding:9px 17px;
  border-radius:13px;
  box-shadow:0 4px 12px rgba(233,154,167,.2)
}
.sent-list{
  margin-top:11px;
  display:flex;
  flex-direction:column;
  gap:8px
}
.sent{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px 12px;
  font-size:12px
}
.sent-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px
}
.who{font-weight:800}
.when{color:var(--muted)}
.sent canvas{
  width:100%;
  height:110px;
  border-radius:12px;
  background:#fffafb
}

.tabs{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,250,248,.95);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:10
}
.tabbar{
  width:min(100%,760px);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))
}
.tab{
  background:none;
  color:#aa9b9f;
  padding:6px 4px;
  border-radius:15px;
  font-size:11px
}
.tab .ico{
  display:block;
  font-size:20px;
  line-height:22px;
  margin-bottom:2px
}
.tab.active{
  color:#d77f8d;
  background:#fff0f2;
  font-weight:800
}

.page-title{
  font-size:26px;
  font-weight:850;
  letter-spacing:-1px;
  margin:6px 2px 16px
}
.add{
  background:var(--pink);
  color:#604c51;
  border-radius:13px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800
}
.list{
  display:flex;
  flex-direction:column;
  gap:10px
}
.row{
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px
}
.row .grow{flex:1}
.row b{font-size:14px}
.row small{
  color:var(--muted);
  display:block;
  margin-top:3px
}
.wish{
  padding:14px;
  display:flex;
  gap:10px;
  align-items:center
}
.wish .heart{font-size:21px}
.check{
  margin-left:auto;
  color:#c59ba2
}
.form{
  padding:16px;
  display:grid;
  gap:10px
}
.input{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:11px 12px;
  outline:none;
  color:var(--text)
}
.input:focus{border-color:#e8b3ba}
.save{
  background:#e89aa6;
  color:white;
  border-radius:13px;
  padding:11px;
  font-weight:800
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:28px 10px;
  font-size:13px
}
.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(10px);
  background:#5b4c50;
  color:#fff;
  padding:10px 14px;
  border-radius:14px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:30
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(75,55,60,.22);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20
}
.modal.show{display:flex}
.sheet{
  width:min(100%,760px);
  background:#fffaf8;
  border-radius:26px 26px 0 0;
  padding:20px;
  box-shadow:0 -12px 40px rgba(70,45,50,.12)
}
.sheet h3{margin:0 0 14px}
.sheet-actions{
  display:flex;
  gap:8px;
  margin-top:10px
}
.secondary{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 14px;
  color:var(--text)
}
.month{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}
.month b{font-size:17px}
.calendar{padding:13px}
.week,.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px
}
.week div{
  text-align:center;
  color:var(--muted);
  font-size:10px;
  padding:5px
}
.day{
  min-height:45px;
  border-radius:11px;
  padding:5px;
  font-size:11px;
  background:#fff
}
.day.today{
  background:#fff0f2;
  color:#d77f8d;
  font-weight:800
}
.day.eventday{outline:1px solid #efc8cd}
.date-num{font-size:11px}
.date-mark{
  font-size:9px;
  color:#b97f87;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden
}
@media(min-width:700px){
  .app{padding-bottom:100px}
  .view{
    padding-left:28px;
    padding-right:28px
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="logo">LoveYou <span>♥</span></div>
    <div class="tiny" id="headerDate"></div>
  </header>

  <main id="home" class="view active">

    <section class="hero">
      <div class="eyebrow">우리의 오늘</div>
      <div class="dday" id="dday">D+0</div>
      <div class="sub" id="startText">
        연애 시작일을 MY에서 설정해 주세요
      </div>
    </section>

    <section class="section">

      <div class="section-title">
        <span>오늘의 약속</span>
        <button class="add" onclick="openEventModal()">+ 추가</button>
      </div>

      <div class="card today" id="homeEvents"></div>

    </section>

    <section class="section">

      <div class="section-title">
        <span>ToYou 💗</span>
        <span class="tiny">보내고 싶은 마음을 그려보세요</span>
      </div>

      <div class="card board">

        <div class="board-head">
          <div class="board-name">ToYou</div>
          <div class="board-note">완성한 뒤 Send ♡</div>
        </div>

        <div class="canvas-wrap">
          <canvas id="boardCanvas"></canvas>
        </div>

        <div class="tools">

          <button
            class="tool active"
            id="penBtn"
            onclick="setTool('pen')">
            ✏️ 펜
          </button>

          <button
            class="tool"
            id="eraserBtn"
            onclick="setTool('eraser')">
            🧽 지우개
          </button>

          <select class="tool size" id="brushSize">
            <option value="2">얇게</option>
            <option value="4" selected>보통</option>
            <option value="7">두껍게</option>
            <option value="11">굵게</option>
          </select>

          <button
            class="tool"
            onclick="clearCanvas()">
            전체 지우기
          </button>

          <button
            class="send"
            onclick="sendBoard()">
            Send ♥
          </button>

        </div>

        <div class="sent-list" id="sentList"></div>

      </div>

    </section>

  </main>


  <main id="calendar" class="view">

    <div class="page-title">
      우리의 캘린더 📅
    </div>

    <div class="card calendar">

      <div class="month">

        <button
          class="tool"
          onclick="changeMonth(-1)">
          ‹
        </button>

        <b id="monthLabel"></b>

        <button
          class="tool"
          onclick="changeMonth(1)">
          ›
        </button>

      </div>

      <div class="week">
        <div>일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div>토</div>
      </div>

      <div class="days" id="days"></div>

    </div>

    <section class="section">

      <div class="section-title">
        <span>예정된 데이트</span>
        <button class="add" onclick="openEventModal()">+ 추가</button>
      </div>

      <div class="list" id="eventList"></div>

    </section>

  </main>


  <main id="date" class="view">

    <div class="page-title">
      우리의 데이트 💕
    </div>

    <section class="section">

      <div class="section-title">
        <span>데이트 기록</span>
        <button class="add" onclick="openEventModal()">+ 일정</button>
      </div>

      <div class="list" id="dateList"></div>

    </section>

    <section class="section">

      <div class="section-title">
        <span>우리의 위시리스트</span>
        <button class="add" onclick="addWish()">+ 추가</button>
      </div>

      <div class="card" id="wishList"></div>

    </section>

  </main>


  <main id="my" class="view">

    <div class="page-title">
      MY 🌷
    </div>

    <div class="card form">

      <input
        class="input"
        id="coupleName"
        placeholder="우리의 이름 (예: 재동 & ○○)">

      <label class="tiny">
        연애 시작일
      </label>

      <input
        class="input"
        id="startDate"
        type="date">

      <label class="tiny">
        내 이름
      </label>

      <input
        class="input"
        id="myName"
        placeholder="내 이름">

      <label class="tiny">
        상대방 이름
      </label>

      <input
        class="input"
        id="partnerName"
        placeholder="상대방 이름">

      <button
        class="save"
        onclick="saveSettings()">
        저장하기 ♥
      </button>

    </div>

    <section class="section">

      <div class="section-title">
        <span>LoveYou 사용 안내</span>
      </div>

      <div
        class="card"
        style="padding:16px;font-size:13px;line-height:1.7;color:var(--muted)">
        현재 이 HTML 파일은 브라우저 저장 방식으로 정보를 유지합니다.
        두 사람의 기기에서 실제로 데이터를 공유하려면 다음 단계에서
        Supabase를 연결하면 됩니다.
      </div>

    </section>

  </main>

</div>


<nav class="tabs">

  <div class="tabbar">

    <button
      class="tab active"
      data-tab="home">
      <span class="ico">🏠</span>
      홈
    </button>

    <button
      class="tab"
      data-tab="calendar">
      <span class="ico">📅</span>
      캘린더
    </button>

    <button
      class="tab"
      data-tab="date">
      <span class="ico">💕</span>
      데이트
    </button>

    <button
      class="tab"
      data-tab="my">
      <span class="ico">🌷</span>
      MY
    </button>

  </div>

</nav>


<div class="modal" id="eventModal">

  <div class="sheet">

    <h3>
      새로운 데이트 💗
    </h3>

    <input
      class="input"
      id="eventTitle"
      placeholder="무엇을 할까요?">

    <input
      class="input"
      id="eventDate"
      type="date">

    <input
      class="input"
      id="eventTime"
      type="time">

    <input
      class="input"
      id="eventPlace"
      placeholder="장소 (선택)">

    <div class="sheet-actions">

      <button
        class="secondary"
        onclick="closeEventModal()">
        취소
      </button>

      <button
        class="save"
        onclick="saveEvent()">
        데이트 저장
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

const KEY='loveyou_v2';

let state =
  JSON.parse(localStorage.getItem(KEY)||'null')
  ||
  {
    settings:{
      coupleName:'',
      startDate:'',
      myName:'나',
      partnerName:'여자친구'
    },
    events:[],
    wishes:[],
    sentBoards:[]
  };


function persist(){
  localStorage.setItem(KEY,JSON.stringify(state));
}


function toast(msg){

  const el=document.getElementById('toast');

  el.textContent=msg;

  el.classList.add('show');

  setTimeout(
    ()=>el.classList.remove('show'),
    1700
  );

}


function esc(s){

  return String(s||'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


function todayISO(){

  const d=new Date();

  return new Date(
    d.getTime()-d.getTimezoneOffset()*60000
  )
  .toISOString()
  .slice(0,10);

}


function renderSettings(){

  coupleName.value=state.settings.coupleName;

  startDate.value=state.settings.startDate;

  myName.value=state.settings.myName;

  partnerName.value=state.settings.partnerName;


  if(state.settings.startDate){

    const start=
      new Date(
        state.settings.startDate+'T00:00:00'
      );

    const now=new Date();

    const diff=
      Math.floor(
        (
          new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
          )
          -start
        )/86400000
      );

    dday.textContent=
      'D+'+Math.max(0,diff);

    startText.textContent=
      (state.settings.coupleName||'우리 둘')
      +' · '
      +state.settings.startDate
      +' 시작';

  }else{

    dday.textContent='D+0';

    startText.textContent=
      '연애 시작일을 MY에서 설정해 주세요';

  }

}


function saveSettings(){

  state.settings={
    coupleName:coupleName.value.trim(),
    startDate:startDate.value,
    myName:myName.value.trim()||'나',
    partnerName:partnerName.value.trim()||'여자친구'
  };

  persist();

  renderSettings();

  toast('저장했어요 ♥');

}


function saveEvent(){

  const title=eventTitle.value.trim();

  if(!title||!eventDate.value){

    toast('제목과 날짜를 입력해 주세요');

    return;

  }

  state.events.push({

    id:Date.now(),

    title,

    date:eventDate.value,

    time:eventTime.value,

    place:eventPlace.value.trim()

  });

  state.events.sort(
    (a,b)=>
      (a.date+a.time)
      .localeCompare(
        b.date+b.time
      )
  );

  persist();

  closeEventModal();

  renderAll();

  toast('데이트를 저장했어요 ♥');

}


function deleteEvent(id){

  state.events=
    state.events.filter(
      e=>e.id!==id
    );

  persist();

  renderAll();

  toast('삭제했어요');

}


function openEventModal(){

  eventModal.classList.add('show');

  eventDate.value=todayISO();

}


function closeEventModal(){

  eventModal.classList.remove('show');

  eventTitle.value='';

  eventTime.value='';

  eventPlace.value='';

}


function eventHTML(e){

  return `
    <div class="row card">

      <div class="dot">
        ♡
      </div>

      <div class="grow">

        <b>
          ${esc(e.title)}
        </b>

        <small>
          ${e.date}
          ${e.time?' · '+e.time:''}
          ${e.place?' · '+esc(e.place):''}
        </small>

      </div>

      <button
        class="tool"
        onclick="deleteEvent(${e.id})">
        삭제
      </button>

    </div>
  `;

}


function renderEvents(){

  const upcoming=
    state.events
    .filter(e=>e.date>=todayISO())
    .slice(0,5);


  homeEvents.innerHTML=
    upcoming.length

    ?

    upcoming
      .map(
        e=>
        `
        <div class="event">

          <div class="dot">
            💕
          </div>

          <div>

            <b>
              ${esc(e.title)}
            </b>

            <small>
              ${e.date}
              ${e.time?' · '+e.time:''}
              ${e.place?' · '+esc(e.place):''}
            </small>

          </div>

        </div>
        `
      )
      .join('')

    :

    `
      <div class="empty">
        아직 약속이 없어요.<br>
        우리의 첫 데이트를 추가해 보세요 ♡
      </div>
    `;


  eventList.innerHTML=
    upcoming.length
    ?
    upcoming.map(eventHTML).join('')
    :
    `
      <div class="card empty">
        예정된 데이트가 없어요 ♡
      </div>
    `;


  dateList.innerHTML=
    state.events.length
    ?
    state.events.map(eventHTML).join('')
    :
    `
      <div class="card empty">
        데이트를 하나씩 기록해 보세요 ♡
      </div>
    `;

}


function addWish(){

  const title=
    prompt(
      '위시리스트에 무엇을 담을까요?'
    );

  if(!title?.trim())return;

  state.wishes.push({

    id:Date.now(),

    title:title.trim(),

    done:false

  });

  persist();

  renderWishes();

  toast(
    '위시리스트에 담았어요 ♥'
  );

}


function toggleWish(id){

  const w=
    state.wishes.find(
      x=>x.id===id
    );

  if(w)w.done=!w.done;

  persist();

  renderWishes();

}


function deleteWish(id){

  state.wishes=
    state.wishes.filter(
      x=>x.id!==id
    );

  persist();

  renderWishes();

}


function renderWishes(){

  wishList.innerHTML=
    state.wishes.length

    ?

    state.wishes
      .map(
        w=>
        `
        <div class="wish">

          <span class="heart">
            ${w.done?'💗':'♡'}
          </span>

          <span
            style="${
              w.done
              ?
              'text-decoration:line-through;color:#b9aaae'
              :
              ''
            }">
            ${esc(w.title)}
          </span>

          <button
            class="check"
            onclick="toggleWish(${w.id})">
            ✓
          </button>

          <button
            class="tool"
            onclick="deleteWish(${w.id})">
            삭제
          </button>

        </div>
        `
      )
      .join('')

    :

    `
      <div class="empty">
        우리 둘의 하고 싶은 일을 담아보세요 ♡
      </div>
    `;

}


let calDate=new Date();


function renderCalendar(){

  const y=calDate.getFullYear();

  const m=calDate.getMonth();

  monthLabel.textContent=
    `${y}년 ${m+1}월`;


  const first=
    new Date(y,m,1).getDay();

  const last=
    new Date(y,m+1,0).getDate();

  const today=todayISO();

  let out='';


  for(
    let i=0;
    i<first;
    i++
  ){

    out+='<div></div>';

  }


  for(
    let d=1;
    d<=last;
    d++
  ){

    const iso=
      `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    const ev=
      state.events.filter(
        e=>e.date===iso
      );


    out+=
      `
      <div
        class="day ${
          iso===today?'today':''
        } ${
          ev.length?'eventday':''
        }">

        <div class="date-num">
          ${d}
        </div>

        ${
          ev
            .slice(0,1)
            .map(
              e=>
              `
              <div class="date-mark">
                ${esc(e.title)}
              </div>
              `
            )
            .join('')
        }

      </div>
      `;

  }


  days.innerHTML=out;

}


function changeMonth(n){

  calDate.setMonth(
    calDate.getMonth()+n
  );

  renderCalendar();

}


function setupCanvas(){

  const c=
    document.getElementById(
      'boardCanvas'
    );

  const r=
    c.getBoundingClientRect();

  const d=
    devicePixelRatio||1;


  c.width=r.width*d;

  c.height=r.height*d;


  const x=
    c.getContext('2d');

  x.scale(d,d);

  x.lineCap='round';

  x.lineJoin='round';


  window.boardCtx=x;

  window.boardCanvas=c;


  redrawCurrent();


  c.onpointerdown=e=>{

    drawing=true;

    last={
      x:e.offsetX,
      y:e.offsetY
    };

    c.setPointerCapture(
      e.pointerId
    );

  };


  c.onpointermove=e=>{

    if(!drawing)return;


    const size=
      +brushSize.value;


    x.globalCompositeOperation=
      toolMode==='eraser'
      ?
      'destination-out'
      :
      'source-over';


    x.strokeStyle='#d77f8d';

    x.lineWidth=size;

    x.beginPath();

    x.moveTo(
      last.x,
      last.y
    );

    x.lineTo(
      e.offsetX,
      e.offsetY
    );

    x.stroke();


    currentStrokes.push({

      x1:last.x,

      y1:last.y,

      x2:e.offsetX,

      y2:e.offsetY,

      w:size,

      erase:
        toolMode==='eraser'

    });


    last={
      x:e.offsetX,
      y:e.offsetY
    };

  };


  c.onpointerup=
    ()=>drawing=false;

  c.onpointercancel=
    ()=>drawing=false;

}


let drawing=false;

let last={
  x:0,
  y:0
};

let toolMode='pen';

let currentStrokes=[];


function setTool(t){

  toolMode=t;

  penBtn.classList.toggle(
    'active',
    t==='pen'
  );

  eraserBtn.classList.toggle(
    'active',
    t==='eraser'
  );

}


function clearCanvas(){

  currentStrokes=[];

  redrawCurrent();

  toast(
    '보드를 비웠어요'
  );

}


function redrawCurrent(){

  if(!window.boardCtx)return;


  const c=boardCanvas;

  const x=boardCtx;


  x.clearRect(
    0,
    0,
    c.clientWidth,
    c.clientHeight
  );


  x.fillStyle='#fffafb';

  x.fillRect(
    0,
    0,
    c.clientWidth,
    c.clientHeight
  );


  x.lineCap='round';

  x.lineJoin='round';


  for(
    const s of currentStrokes
  ){

    x.globalCompositeOperation=
      s.erase
      ?
      'destination-out'
      :
      'source-over';

    x.strokeStyle='#d77f8d';

    x.lineWidth=s.w;

    x.beginPath();

    x.moveTo(
      s.x1,
      s.y1
    );

    x.lineTo(
      s.x2,
      s.y2
    );

    x.stroke();

  }


  x.globalCompositeOperation=
    'source-over';

}


function sendBoard(){

  if(!currentStrokes.length){

    toast(
      '먼저 마음을 그려 주세요 ♡'
    );

    return;

  }


  const who=
    state.settings.myName||'나';


  state.sentBoards.unshift({

    id:Date.now(),

    who,

    at:new Date()
      .toLocaleString('ko-KR'),

    strokes:
      JSON.parse(
        JSON.stringify(
          currentStrokes
        )
      )

  });


  state.sentBoards=
    state.sentBoards.slice(
      0,
      10
    );


  persist();

  renderSentBoards();

  clearCanvas();

  toast(
    'ToYou로 마음을 보냈어요 ♥'
  );

}


function renderSentBoards(){

  sentList.innerHTML=
    state.sentBoards.length

    ?

    state.sentBoards
      .map(
        b=>
        `
        <div class="sent">

          <div class="sent-head">

            <span class="who">
              ${esc(b.who)}의 ToYou ♥
            </span>

            <span class="when">
              ${esc(b.at)}
            </span>

          </div>

          <canvas
            id="sent-${b.id}">
          </canvas>

        </div>
        `
      )
      .join('')

    :

    '';


  requestAnimationFrame(
    ()=>
    state.sentBoards.forEach(
      b=>{

        const c=
          document.getElementById(
            'sent-'+b.id
          );

        if(!c)return;


        const d=
          devicePixelRatio||1;


        c.width=
          c.clientWidth*d;

        c.height=
          c.clientHeight*d;


        const x=
          c.getContext('2d');


        x.scale(d,d);

        x.fillStyle='#fffafb';

        x.fillRect(
          0,
          0,
          c.clientWidth,
          c.clientHeight
        );


        x.lineCap='round';

        x.lineJoin='round';


        const maxX=
          Math.max(
            1,
            ...b.strokes.map(
              s=>
                Math.max(
                  s.x1,
                  s.x2
                )
            )
          );


        const maxY=
          Math.max(
            1,
            ...b.strokes.map(
              s=>
                Math.max(
                  s.y1,
                  s.y2
                )
            )
          );


        const sx=
          (c.clientWidth-20)/
          Math.max(maxX,1);


        const sy=
          (c.clientHeight-20)/
          Math.max(maxY,1);


        const sc=
          Math.min(
            sx,
            sy,
            1.6
          );


        for(
          const s of b.strokes
        ){

          x.globalCompositeOperation=
            s.erase
            ?
            'destination-out'
            :
            'source-over';


          x.strokeStyle='#d77f8d';

          x.lineWidth=
            s.w*sc;


          x.beginPath();

          x.moveTo(
            s.x1*sc+10,
            s.y1*sc+10
          );

          x.lineTo(
            s.x2*sc+10,
            s.y2*sc+10
          );

          x.stroke();

        }


        x.globalCompositeOperation=
          'source-over';

      }
    )
  );

}


function renderAll(){

  renderSettings();

  renderEvents();

  renderWishes();

  renderCalendar();

  renderSentBoards();

}


document
  .querySelectorAll('.tab')
  .forEach(
    btn=>
      btn.addEventListener(
        'click',
        ()=>{

          document
            .querySelectorAll('.tab')
            .forEach(
              b=>
                b.classList.remove(
                  'active'
                )
            );


          btn.classList.add(
            'active'
          );


          document
            .querySelectorAll('.view')
            .forEach(
              v=>
                v.classList.remove(
                  'active'
                )
            );


          document
            .getElementById(
              btn.dataset.tab
            )
            .classList.add(
              'active'
            );


          if(
            btn.dataset.tab==='home'
          ){

            setTimeout(
              setupCanvas,
              20
            );

          }

        }
      )
  );


window.addEventListener(
  'resize',
  ()=>{

    if(
      document
        .getElementById('home')
        .classList
        .contains('active')
    ){

      const old=
        currentStrokes;

      setTimeout(
        setupCanvas,
        20
      );

      currentStrokes=old;

    }

  }
);


headerDate.textContent=
  new Date()
    .toLocaleDateString(
      'ko-KR',
      {
        month:'long',
        day:'numeric',
        weekday:'short'
      }
    );


renderAll();

setTimeout(
  setupCanvas,
  30
);

</script>
